version: v2
plugins:
  - remote: buf.build/bufbuild/es:v2.2.2
    out: stubs/ts
    opt:
      - target=ts
      # Emit explicit .js extensions on relative imports so the compiled stubs
      # resolve under Node's native ESM (the CLI runs the built output directly,
      # not through a bundler).
      - import_extension=js
    include_imports: true
inputs:
  - directory: .
