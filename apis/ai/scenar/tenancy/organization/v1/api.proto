syntax = "proto3";

package ai.scenar.tenancy.organization.v1;

import "ai/scenar/commons/apiresource/metadata.proto";
import "ai/scenar/tenancy/organization/v1/spec.proto";
import "ai/scenar/tenancy/organization/v1/status.proto";
import "buf/validate/validate.proto";

// Organization is the top-level tenant that owns and manages every other Scenar
// resource. It follows the Kubernetes-style envelope shared by every Scenar
// resource — api_version / kind / metadata / spec / status — so the Scenar
// Cloud backend can manage organizations through the platform's generic
// resource machinery.
//
// All scenarios, API keys, and other resources are scoped under exactly one
// organization, which is what enables multi-tenancy and resource isolation in
// the cloud product.
message Organization {
  // API version of this resource, in `<group-domain>/<version>` form. Pinned to
  // the tenancy group's domain so the value is self-describing and routable by
  // the platform's resource registry.
  //
  // Must be exactly "tenancy.scenar.ai/v1".
  string api_version = 1 [(buf.validate.field).string.const = 'tenancy.scenar.ai/v1'];

  // Resource kind discriminator. Pairs with api_version to uniquely identify
  // the resource type within a multi-kind document stream.
  //
  // Must be exactly "Organization".
  string kind = 2 [(buf.validate.field).string.const = 'Organization'];

  // Standard resource metadata: name, slug, owning org, visibility, labels,
  // annotations, and tags. Required — every organization must carry identity.
  // See ai.scenar.commons.apiresource.ApiResourceMetadata.
  ai.scenar.commons.apiresource.ApiResourceMetadata metadata = 3 [(buf.validate.field).required = true];

  // Desired state: the organization's configurable properties (description,
  // logo). Authored by users and validated on apply. See OrganizationSpec.
  OrganizationSpec spec = 4;

  // Observed state: system-computed fields such as the member count and audit.
  // Populated by the backend; ignored on write. See OrganizationStatus.
  OrganizationStatus status = 5;
}

// OrganizationList is the paginated result of a list query over organizations.
// It mirrors the resource envelope (api_version / kind) at the collection level
// so list responses are self-describing.
message OrganizationList {
  // API version of the list envelope. Echoes the resource's api_version.
  string api_version = 1;

  // Kind discriminator for the list envelope (e.g. "OrganizationList").
  string kind = 2;

  // The page of organizations in this response, in server-defined order.
  repeated Organization items = 3;

  // Opaque cursor for fetching the next page. Empty when this is the last page.
  // Pass back as ListOrganizationsRequest.page_token to continue iterating.
  string next_page_token = 4;
}
