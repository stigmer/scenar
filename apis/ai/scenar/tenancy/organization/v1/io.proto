syntax = "proto3";

package ai.scenar.tenancy.organization.v1;

import "buf/validate/validate.proto";

// ListOrganizationsRequest is the input for the organization list query. Unlike
// most resources, organizations are top-level tenants and are not scoped to a
// parent org, so the request only carries pagination.
//
// Pagination is defined per-resource here (rather than in commons) until the
// platform settles on a shared pagination contract; the field shape
// (page_size / page_token / next_page_token) is the conventional cursor model
// and is intended to migrate to commons unchanged when that contract lands.
message ListOrganizationsRequest {
  // Maximum number of organizations to return in one page. When 0 or unset, the
  // server applies its default page size. The server may return fewer items
  // than requested.
  int32 page_size = 1 [(buf.validate.field).int32.gte = 0];

  // Opaque cursor identifying the page to return. Empty fetches the first page.
  // Pass the next_page_token from the previous OrganizationList to continue.
  string page_token = 2;
}
