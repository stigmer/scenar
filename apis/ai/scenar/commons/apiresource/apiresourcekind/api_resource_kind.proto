syntax = "proto3";

package ai.scenar.commons.apiresource.apiresourcekind;

import "ai/scenar/commons/apiresource/apiresourcekind/api_resource_group.proto";
import "ai/scenar/commons/apiresource/apiresourcekind/authorization_config.proto";
import "google/protobuf/descriptor.proto";

// Enum-value option carrying metadata for each ApiResourceKind value.
extend google.protobuf.EnumValueOptions {
  ApiResourceKindMeta kind_meta = 90101;
}

// ApiResourceVersion is the API version of a resource kind. A single version
// (v1) exists today; the enum leaves room for future major versions.
enum ApiResourceVersion {
  // Default value when no version is set.
  api_resource_version_unspecified = 0;

  // Version 1 — the current API version for all resource kinds.
  v1 = 1;
}

// ResourceTier defines the availability context of a resource kind: whether it
// exists in the open-source/local surface or only in the hosted Cloud.
enum ResourceTier {
  resource_tier_unspecified = 0;
  // Available in CLI local mode and Cloud.
  open_source = 1;
  // Hidden in CLI local mode; available in Cloud only.
  cloud_only = 2;
}

// PlatformIdValue defines the singleton platform instance ID. Used wherever a
// platform kind value is required (e.g. platform-level authorization scopes).
enum PlatformIdValue {
  platform_id_value_unspecified = 0;

  // The Scenar platform singleton instance. Used as the resource ID for
  // platform-level authorization.
  scenar = 1;
}

// ApiResourceKindMeta describes a resource kind: its group, version, names,
// id prefix, versioning behaviour, availability tier, and authorization
// configuration. This is the data the platform's kind registry exposes for
// each kind.
message ApiResourceKindMeta {
  // Functional group this kind belongs to. Determines the api_version domain.
  ApiResourceGroup group = 1;

  // API version of this kind.
  ApiResourceVersion version = 2;

  // PascalCase type name of the kind (e.g. "Scenario"). Matches the `kind`
  // field value on the resource envelope.
  string name = 3;

  // Human-readable display name (e.g. "API Key").
  string display_name = 4;

  // Prefix applied to the resource's metadata.id (e.g. "scn" -> "scn_abc123").
  // Keeps ids self-describing and globally sortable by kind.
  string id_prefix = 5;

  // Whether this kind is versioned (each spec change produces a new immutable
  // version with a content hash in metadata.version). Most kinds are not.
  bool is_versioned = 6;

  // Whether this kind is excluded from the search index.
  bool not_search_indexed = 7;

  // Availability context - whether the kind is open-source/local or cloud-only.
  ResourceTier tier = 8;

  // FGA authorization configuration - defines how FGA tuples are created for
  // this resource kind at runtime.
  AuthorizationConfig authorization = 9;
}

// ApiResourceKind enumerates every kind of API resource Scenar manages. The
// value names are lowercase by convention and are the canonical machine
// identifier for each kind; the attached kind_meta carries the descriptive
// metadata.
enum ApiResourceKind {
  // Default value for an unset or unrecognized kind.
  api_resource_kind_unknown = 0;

  // An immutable version record tracking a change to a versioned API resource.
  // System-managed; created by the platform when a versioned resource's spec
  // changes. Not authored directly by users.
  api_resource_version = 4 [(kind_meta) = {
    group: tenancy
    version: v1
    name: "ApiResourceVersion"
    display_name: "API Resource Version"
    id_prefix: "ver"
    is_versioned: false
    not_search_indexed: true
    tier: cloud_only
    authorization: {
      scope_type: AUTHORIZATION_SCOPE_TYPE_NONE
      owner_type: OWNER_ATTRIBUTION_TYPE_NONE
    }
  }];

  // A scenario: the choreography of a visual product walkthrough.
  scenario = 1 [(kind_meta) = {
    group: studio
    version: v1
    name: "Scenario"
    display_name: "Scenario"
    id_prefix: "scn"
    is_versioned: false
    not_search_indexed: false
    tier: open_source
    authorization: {
      scope_type: AUTHORIZATION_SCOPE_TYPE_ORGANIZATION
      owner_type: OWNER_ATTRIBUTION_TYPE_DIRECT
      visibility: {supports_public: true}
      grantable_roles: [
        owner,
        viewer
      ]
    }
  }];

  // A deploy: one immutable publication of a scenario's bundle, served at a
  // per-deploy origin. A child of scenario — it inherits view/edit/delete from
  // the scenario it snapshots (PARENT scope via spec.scenario_id; owner is
  // computed from the parent, so no owner tuple is written and no roles are
  // independently grantable). Cloud-only: created by the deploy/serving path,
  // never authored in the OSS/local CLI.
  deploy = 5 [(kind_meta) = {
    group: studio
    version: v1
    name: "Deploy"
    display_name: "Deploy"
    id_prefix: "dep"
    is_versioned: false
    not_search_indexed: true
    tier: cloud_only
    authorization: {
      scope_type: AUTHORIZATION_SCOPE_TYPE_PARENT
      owner_type: OWNER_ATTRIBUTION_TYPE_INHERITED
      parent: {
        kind: "scenario"
        relation: "scenario"
        spec_field: "scenario_id"
      }
    }
  }];

  // An organization: the top-level tenant that owns and manages resources.
  organization = 2 [(kind_meta) = {
    group: tenancy
    version: v1
    name: "Organization"
    display_name: "Organization"
    id_prefix: "org"
    is_versioned: false
    not_search_indexed: false
    tier: open_source
    authorization: {
      scope_type: AUTHORIZATION_SCOPE_TYPE_OWNER_ONLY
      owner_type: OWNER_ATTRIBUTION_TYPE_DIRECT
      grantable_roles: [
        owner,
        admin,
        member,
        viewer
      ]
    }
  }];

  // An API key: a credential for programmatic access (e.g. CLI deploys).
  api_key = 3 [(kind_meta) = {
    group: iam
    version: v1
    name: "ApiKey"
    display_name: "API Key"
    id_prefix: "key"
    is_versioned: false
    not_search_indexed: true
    tier: cloud_only
    authorization: {
      scope_type: AUTHORIZATION_SCOPE_TYPE_OWNER_ONLY
      owner_type: OWNER_ATTRIBUTION_TYPE_DIRECT
    }
  }];

  // An IAM policy: a role-based access grant binding a principal to a resource.
  iam_policy = 10 [(kind_meta) = {
    group: iam
    version: v1
    name: "IamPolicy"
    display_name: "IAM Policy"
    id_prefix: "iamp"
    is_versioned: false
    not_search_indexed: true
    tier: cloud_only
    authorization: {
      scope_type: AUTHORIZATION_SCOPE_TYPE_ORGANIZATION
      owner_type: OWNER_ATTRIBUTION_TYPE_DIRECT
    }
  }];

  // An identity account: a user or machine principal in the identity system.
  identity_account = 11 [(kind_meta) = {
    group: iam
    version: v1
    name: "IdentityAccount"
    display_name: "Identity Account"
    id_prefix: "ida"
    is_versioned: false
    not_search_indexed: false
    tier: cloud_only
    authorization: {
      scope_type: AUTHORIZATION_SCOPE_TYPE_OWNER_ONLY
      owner_type: OWNER_ATTRIBUTION_TYPE_SELF
    }
  }];

  // The singleton platform instance representing the Scenar deployment.
  platform = 31 [(kind_meta) = {
    group: tenancy
    version: v1
    name: "Platform"
    display_name: "Platform"
    id_prefix: "plt"
    is_versioned: false
    not_search_indexed: true
    tier: cloud_only
    authorization: {
      scope_type: AUTHORIZATION_SCOPE_TYPE_NONE
      owner_type: OWNER_ATTRIBUTION_TYPE_NONE
    }
  }];
}
