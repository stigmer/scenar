syntax = "proto3";

package ai.scenar.commons.apiresource;

// ApiResourceVisibility controls who can access an API resource.
//
// Visibility is orthogonal to ownership: ownership (the org on the resource
// metadata) determines who *manages* a resource, while visibility determines
// who can *access* it. Every resource belongs to exactly one organization;
// visibility decides whether principals outside that organization may read it.
//
// Scenar supports two levels today (PRIVATE and PUBLIC). PUBLIC exists for
// embeddable walkthroughs that are meant to be viewed by anyone with the embed
// URL, while write access still requires org membership. Additional levels
// (e.g. org-wide) can be appended later without breaking the wire format.
//
// The enum value *names* are the contract the platform's neutral metadata
// reflection adapter keys off — do not rename them. The names intentionally
// carry a `visibility_` prefix to avoid collisions with reserved keywords in
// generated Java/Python code.
enum ApiResourceVisibility {
  // Default/unset. The backend infers the effective visibility from context;
  // for newly created resources this resolves to visibility_private.
  api_resource_visibility_unspecified = 0;

  // Only members of the owning organization (and explicitly granted
  // principals) can access the resource. This is the default for new
  // resources.
  visibility_private = 1;

  // Anyone can read the resource. Used for published, embeddable scenarios
  // served at a public URL. Write access still requires org membership.
  visibility_public = 2;
}

// ApiResourceEventType enumerates the lifecycle events emitted by command
// controllers across all API resources.
//
// A single shared enum is used (rather than a per-resource enum) because
// events are serialized to strings when they cross message-passing
// boundaries; the resource kind is carried alongside the event separately.
enum ApiResourceEventType {
  // Default value when no event type is set.
  unspecified = 0;

  // The resource was created.
  created = 1;

  // The resource spec or status was updated.
  updated = 2;

  // The resource was deleted.
  deleted = 3;

  // The resource was renamed (its slug changed).
  renamed = 4;
}
