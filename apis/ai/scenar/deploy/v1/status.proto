syntax = "proto3";

package ai.scenar.deploy.v1;

import "ai/scenar/commons/apiresource/field_options.proto";
import "ai/scenar/commons/apiresource/status.proto";
import "ai/scenar/deploy/v1/enum.proto";

// DeployStatus is the observed state of a Deploy resource — the `status` block
// of the envelope (see api.proto). Every field is computed and managed by the
// system; clients never set status. The backend derives these values as it
// creates, verifies, publishes, and serves a deploy.
message DeployStatus {
  // Current lifecycle phase. The serving edge only returns content while this
  // is `active`; the backend's DeployStateMachine governs how it advances.
  DeployState state = 1 [(ai.scenar.commons.apiresource.computed) = true];

  // Per-deploy public URL at which this immutable snapshot is served (the
  // d-<deployId> content-domain origin). Computed when the deploy goes
  // `active`. Empty until then.
  string embed_url = 2 [(ai.scenar.commons.apiresource.computed) = true];

  // Immutable object-store key prefix that holds this deploy's bundle
  // (tenants/<org>/scenarios/<scenario>/deploys/<deploy>/). Computed at
  // creation; a deploy's objects are never written outside this prefix.
  string object_key_prefix = 3 [(ai.scenar.commons.apiresource.computed) = true];

  // Human-readable reason the deploy is not servable when state is a failure or
  // takedown phase (e.g. a failed scan or an abuse takedown note). Empty on the
  // happy path.
  string error_reason = 4 [(ai.scenar.commons.apiresource.computed) = true];

  // Standard creation/modification audit information. The high field number
  // keeps audit at a stable, conventional location and leaves room below for
  // future deploy-specific status fields (e.g. per-transition timestamps added
  // with the publication command surface).
  //
  // Typed as ApiResourceAudit directly (not the ApiResourceAuditStatus
  // wrapper): the platform's audit reflection adapter locates this block by the
  // field name `audit` on the status message and requires its type to be
  // ApiResourceAudit.
  ai.scenar.commons.apiresource.ApiResourceAudit audit = 99;
}
