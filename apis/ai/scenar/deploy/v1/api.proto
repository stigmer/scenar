syntax = "proto3";

package ai.scenar.deploy.v1;

import "ai/scenar/commons/apiresource/metadata.proto";
import "ai/scenar/deploy/v1/spec.proto";
import "ai/scenar/deploy/v1/status.proto";
import "buf/validate/validate.proto";

// Deploy is the top-level API resource for one immutable publication of a
// Scenario — the unit the platform packages, verifies, serves, and rolls back.
// It follows the Kubernetes-style envelope shared by every Scenar resource
// (api_version / kind / metadata / spec / status).
//
// A deploy is a child of exactly one Scenario (spec.scenario_id) and is created
// by the backend, not authored by users: the two-phase upload session mints a
// deploy in `pending_upload`, advances it through verification, and publishes it
// by flipping the parent Scenario's status.current_deploy_id pointer once it is
// `active`. Immutability is the core property — a deploy is never modified in
// place; a new publication is a new deploy, which makes long-lived edge caching
// safe and rollback a pointer flip.
//
// Deploy is a Cloud-only resource: it has no meaning in the OSS/local CLI
// surface, only in hosted Scenar Cloud.
message Deploy {
  // API version of this resource, in `<group-domain>/<version>` form. Deploy
  // belongs to the studio group (alongside Scenario), so it shares the studio
  // domain.
  //
  // Must be exactly "scenario.scenar.ai/v1".
  string api_version = 1 [(buf.validate.field).string.const = 'scenario.scenar.ai/v1'];

  // Resource kind discriminator. Pairs with api_version to uniquely identify the
  // resource type.
  //
  // Must be exactly "Deploy".
  string kind = 2 [(buf.validate.field).string.const = 'Deploy'];

  // Standard resource metadata: id, owning org (inherited from the parent
  // scenario), slug, labels, annotations. Populated by the backend.
  ai.scenar.commons.apiresource.ApiResourceMetadata metadata = 3;

  // Desired state: the parent scenario link. See DeploySpec.
  DeploySpec spec = 4;

  // Observed state: lifecycle phase, serving URL, object prefix. Populated by
  // the backend; ignored on write. See DeployStatus.
  DeployStatus status = 5;
}

// DeployList is the paginated result of a list query over deploys. It mirrors
// the resource envelope (api_version / kind) at the collection level so list
// responses are self-describing.
message DeployList {
  // API version of the list envelope. Echoes the resource's api_version.
  string api_version = 1;

  // Kind discriminator for the list envelope (e.g. "DeployList").
  string kind = 2;

  // The page of deploys in this response, in server-defined order.
  repeated Deploy items = 3;

  // Opaque cursor for fetching the next page. Empty when this is the last page.
  // Pass back as ListDeploysRequest.page_token to continue iterating.
  string next_page_token = 4;
}
