syntax = "proto3";

package ai.scenar.deploy.v1;

import "ai/scenar/commons/apiresource/io.proto";
import "ai/scenar/commons/apiresource/rpc_service_options.proto";
import "ai/scenar/deploy/v1/api.proto";
import "ai/scenar/deploy/v1/io.proto";

// DeployQueryController provides the read operations for deploy resources. It is
// the contract the Scenar Cloud backend implements for fetching deploys and
// listing the deploys of a scenario (e.g. for the console's deploy history and
// the resolver that maps a scenario to its current deploy).
//
// Deploy's write surface — the two-phase upload session that creates a deploy,
// advances it through verification, and publishes it (CreateDeployUploadSession /
// CompleteDeployUploadSession and the lifecycle transitions) — is deliberately
// omitted here until the object-storage data plane it depends on exists. It is
// added as a sibling DeployCommandController alongside that wiring, keeping the
// OSS contract free of RPC surface no caller can yet exercise — the same
// discipline the iampolicy and identityaccount controllers apply to their
// deferred operations.
//
// Authorization note: as with the scenario controllers, per-RPC authorization
// options are intentionally absent until Scenar adopts a neutral method-level
// auth contract. These RPCs carry only the service-level resource-kind tag; the
// Cloud backend enforces read authorization in its handlers, against the parent
// scenario (a deploy inherits visibility from the scenario it snapshots).
service DeployQueryController {
  // Tags this controller with the resource kind it manages so the platform's
  // request pipeline can route and register it generically.
  option (ai.scenar.commons.apiresource.api_resource_kind) = deploy;

  // Get a deploy by its system-generated id (metadata.id).
  rpc get(ai.scenar.commons.apiresource.ApiResourceId) returns (Deploy);

  // List the deploys of a scenario, paged by cursor. See ListDeploysRequest and
  // DeployList.
  rpc list(ListDeploysRequest) returns (DeployList);
}
