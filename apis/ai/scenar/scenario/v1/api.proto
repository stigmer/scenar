syntax = "proto3";

package ai.scenar.scenario.v1;

import "ai/scenar/commons/apiresource/metadata.proto";
import "ai/scenar/scenario/v1/spec.proto";
import "ai/scenar/scenario/v1/status.proto";
import "buf/validate/validate.proto";

// Scenario is the top-level API resource for a visual product walkthrough. It
// follows the Kubernetes-style envelope shared by every Scenar resource —
// api_version / kind / metadata / spec / status — so that the Scenar Cloud
// backend can manage scenarios through the platform's generic resource
// machinery.
//
// The envelope cleanly separates the three concerns of a resource:
//   - metadata: identity and ownership (name, slug, org, visibility) that is
//     identical in shape across all kinds.
//   - spec: the desired state authored by users (the walkthrough choreography).
//   - status: the observed state computed by the system (generated URLs, etc.).
//
// A Scenario is authored as a single YAML document carrying all five fields and
// applied via the CLI (`scenar` apply). The CLI validates the spec, the backend
// assigns identity in metadata and populates status.
message Scenario {
  // API version of this resource, in `<group-domain>/<version>` form. Pinned to
  // the studio group's domain so the value is self-describing and routable by
  // the platform's resource registry.
  //
  // Must be exactly "scenario.scenar.ai/v1".
  string api_version = 1 [(buf.validate.field).string.const = 'scenario.scenar.ai/v1'];

  // Resource kind discriminator. Pairs with api_version to uniquely identify
  // the resource type within a multi-kind document stream.
  //
  // Must be exactly "Scenario".
  string kind = 2 [(buf.validate.field).string.const = 'Scenario'];

  // Standard resource metadata: name, slug, owning org, visibility, labels,
  // annotations, and tags. Required — every scenario must carry identity and
  // ownership. See ai.scenar.commons.apiresource.ApiResourceMetadata.
  ai.scenar.commons.apiresource.ApiResourceMetadata metadata = 3 [(buf.validate.field).required = true];

  // Desired state: the walkthrough choreography (viewport + ordered steps).
  // Authored by users and validated on apply. See ScenarioSpec.
  ScenarioSpec spec = 4;

  // Observed state: system-computed fields such as the embed and package URLs.
  // Populated by the backend; ignored on write. See ScenarioStatus.
  ScenarioStatus status = 5;
}

// ScenarioList is the paginated result of a list query over scenarios. It mirrors
// the resource envelope (api_version / kind) at the collection level so list
// responses are self-describing.
message ScenarioList {
  // API version of the list envelope. Echoes the resource's api_version.
  string api_version = 1;

  // Kind discriminator for the list envelope (e.g. "ScenarioList").
  string kind = 2;

  // The page of scenarios in this response, in server-defined order.
  repeated Scenario items = 3;

  // Opaque cursor for fetching the next page. Empty when this is the last page.
  // Pass back as ListScenariosRequest.page_token to continue iterating.
  string next_page_token = 4;
}
