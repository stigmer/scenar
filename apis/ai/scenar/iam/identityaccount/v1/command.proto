syntax = "proto3";

package ai.scenar.iam.identityaccount.v1;

import "ai/scenar/commons/apiresource/rpc_service_options.proto";
import "ai/scenar/iam/identityaccount/v1/api.proto";

// IdentityAccountCommandController provides the write operations for identity
// account resources — the principals every authorization decision is made
// about. It is the contract the Scenar Cloud backend implements when accounts
// are provisioned.
//
// These RPCs are internal, in-process calls made by the Cloud backend itself
// (the authentication/provisioning flow and the day-0 bootstrap migration),
// never exposed to external clients. The controller therefore carries only the
// one write operation the backend consumes today:
//
//   - create: provision a new identity account (the principal-creation path).
//
// The federated-account write operations from the platform's full surface
// (createFederatedAccount / updateFederatedAccount / deprovisionFederatedAccount)
// are intentionally omitted until a federated-provisioning flow exists, keeping
// the OSS contract free of unused RPC surface — the same discipline the apikey
// and iampolicy controllers apply to their omitted operations. Their request
// messages already live in io.proto; only the service surface is deferred.
//
// Authorization note: as with the apikey and iampolicy controllers, per-RPC
// authorization options are intentionally absent until Scenar adopts a neutral
// method-level auth contract. These RPCs carry only the service-level
// resource-kind tag; the Cloud backend enforces authorization in its handlers.
// create is a special case with no FGA authorize step at all: it is called only
// over the system channel, and the account being created is itself the
// principal — there is no tuple to authorize against until it exists (the same
// bootstrap problem bootstrapPolicy solves on the iampolicy side).
service IdentityAccountCommandController {
  // Tags this controller with the resource kind it manages so the platform's
  // request pipeline can route and register it generically.
  option (ai.scenar.commons.apiresource.api_resource_kind) = identity_account;

  // Provision a new identity account. The caller supplies the spec (idp_id and,
  // for human accounts, profile fields); the backend generates the id, stamps
  // metadata/audit, persists to MongoDB, and writes the account's initial
  // authorization tuple — the self-owner grant — via bootstrapPolicy
  // (identity_account is owner-only scope with self ownership, so there is no
  // platform or org link). The account being created is the principal, so this
  // carries no FGA authorize step and is restricted to the system channel.
  // See IdentityAccount.
  rpc create(IdentityAccount) returns (IdentityAccount);
}
