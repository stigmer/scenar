syntax = "proto3";

package ai.scenar.iam.iampolicy.v1;

import "ai/scenar/commons/apiresource/metadata.proto";
import "ai/scenar/commons/apiresource/status.proto";
import "ai/scenar/iam/iampolicy/v1/spec.proto";
import "buf/validate/validate.proto";

// IamPolicy represents a binding between a principal (who), a resource (what),
// and a relation/permission (how).
//
// An IAM policy grants a specific permission (relation) to a principal on a resource.
// For example: "Grant 'admin' permission to user 'jane@example.com' on scenario 'scn-123'"
//
// The policy is the source of truth for authorization and is synced to the
// authorization backend (OpenFGA) as FGA tuples.
message IamPolicy {
  // API version for this resource type.
  string api_version = 1 [(buf.validate.field).string.const = 'iam.scenar.ai/v1'];

  // Resource kind identifier.
  string kind = 2 [(buf.validate.field).string.const = 'IamPolicy'];

  // Resource metadata including name, organization, and labels.
  //
  // @internal
  // id format: iamp_<ulid>
  // name: human-readable identifier (e.g., "jane-scenario-admin")
  // org: organization this policy belongs to
  ai.scenar.commons.apiresource.ApiResourceMetadata metadata = 3;

  // Policy binding: principal, resource, and relation.
  IamPolicySpec spec = 4;

  // System-managed state including audit trail.
  IamPolicyStatus status = 5;
}

// IamPolicyStatus represents the runtime state of the IAM policy.
// It contains information about the policy's lifecycle and sync status with
// the authorization backend.
message IamPolicyStatus {
  // Standard audit status containing created_by, created_at, updated_by, updated_at
  ai.scenar.commons.apiresource.ApiResourceAudit audit = 1;
}
