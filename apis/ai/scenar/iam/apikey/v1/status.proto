syntax = "proto3";

package ai.scenar.iam.apikey.v1;

import "ai/scenar/commons/apiresource/field_options.proto";
import "ai/scenar/commons/apiresource/status.proto";
import "google/protobuf/timestamp.proto";

// ApiKeyStatus is the observed state of an ApiKey resource — the `status` block
// of the envelope (see api.proto). Every field here is computed and managed by
// the system; clients never set status on create or update.
message ApiKeyStatus {
  // Timestamp of the most recent successful authentication made with this key.
  // Computed by the backend; unset until the key has been used at least once.
  google.protobuf.Timestamp last_used_at = 1 [(ai.scenar.commons.apiresource.computed) = true];

  // The raw, plaintext key. This is the ONLY moment the secret is ever
  // visible: it is populated solely in the response to
  // ApiKeyCommandController.create and is never persisted, cached, logged, or
  // returned by any other RPC (get, getByKeyHash, list). The backend MUST clear
  // this field before storing the resource's status. Callers must capture it
  // from the create response immediately — it cannot be retrieved again.
  string plaintext_key = 2 [(ai.scenar.commons.apiresource.computed) = true];

  // Standard creation/modification audit information. The high field number
  // keeps audit at a stable, conventional location and leaves room below for
  // future API-key-specific status fields.
  //
  // Typed as ApiResourceAudit directly (not the ApiResourceAuditStatus
  // wrapper): the platform's audit reflection adapter locates this block by the
  // field name `audit` on the status message and requires its type to be
  // ApiResourceAudit. The wrapper is only used when a resource's entire status
  // field is the audit block.
  ai.scenar.commons.apiresource.ApiResourceAudit audit = 99;
}
