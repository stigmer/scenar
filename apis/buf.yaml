version: v2
deps:
  - buf.build/bufbuild/protovalidate
modules:
  - path: .
    name: buf.build/scenar/apis
lint:
  use:
    - STANDARD
  except:
    - FIELD_NOT_REQUIRED
    - ENUM_VALUE_UPPER_SNAKE_CASE
    - ENUM_VALUE_PREFIX
    - ENUM_ZERO_VALUE_SUFFIX
    # The commons/apiresource package is intentionally unversioned to mirror the
    # platform's shared contract (ai.stigmer.commons.apiresource). Commons is
    # foundational and evolves additively, not via package version bumps.
    - PACKAGE_VERSION_SUFFIX
breaking:
  use:
    - FILE
